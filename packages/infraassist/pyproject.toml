[project]
name = "infraassist"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.41.1",
    "loguru>=0.7.3",
    "tenacity>=9.1.4",
    "redis>=8.0.0",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "pydantic-settings>=2.14.1",
    "proxmoxer>=2.3.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infraassist"]
