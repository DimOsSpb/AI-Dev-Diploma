[project]
name = "diploma"
version = "0.1.0"
description = "Дипломная работа по курсу AI-Dev"
readme = "README.md"
authors = [
    { name = "Dmitrii Osipov", email = "dimosspb@vk.ru" }
]
requires-python = ">=3.13, <3.14"

dependencies = [
    "fastapi[standard]>=0.137.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.49.0",
    "openai>=2.43.0",
    "redis>=8.0.0",
    "tenacity>=9.0",
    "loguru>=0.7.3",
    "sse-starlette>=3.4.4",
    "httpx[socks]>=0.28.1",
    "structlog>=0.14.2",
    "arize-phoenix>=17.11.0",
    "openinference-instrumentation-openai>=0.1.52",
    "garak>=0.15.1",
    "aiofiles>=25.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "aiogram>=3.29.1",
    "telegramify-markdown>=1.2.0",
    "aiohttp-socks>=0.11.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "telegramify-markdown>=0.5",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "tqdm>=4.66",
    "qdrant-client>=1.18.0",
    "llama-index>=0.14.23",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "llama-index-readers-file>=0.6.0",
    "sentence-transformers>=5.6.1",
    "llama-index-llms-openai>=0.7.10",
    "llama-index-postprocessor-cohere-rerank>=0.9.0",
]


[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::pydantic.PydanticDeprecatedSince20"
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic" # Вместо рекомендованного строгого режима

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.workspace]
members = [
    "kb-builder",
]
