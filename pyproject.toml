[project]
name = "diploma"
version = "0.1.0"
description = "Дипломная работа по курсу AI-Dev"
readme = "README.md"
authors = [
    { name = "Dmitrii Osipov", email = "dimosspb@vk.ru" }
]
requires-python = ">=3.13, <3.14"

dependencies = [
    "fastapi[standard]>=0.137.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.49.0",
    "openai>=2.43.0",
    "redis>=8.0.0",
    "tenacity>=8.2",
    "loguru>=0.7.3",
    "sse-starlette>=3.4.4",
    "httpx[socks]>=0.28.1",
    "structlog>=0.14.2",
    "arize-phoenix>=17.11.0",
    "openinference-instrumentation-openai>=0.1.52",


]


[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic" # Вместо рекомендованного строгого режима
