[project]
name = "diploma"
version = "0.1.0"
description = "Дипломная работа по курсу AI-Dev"
readme = "README.md"
authors = [
    { name = "Dmitrii Osipov", email = "dimosspb@vk.ru" }
]
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.137.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.49.0",
    "openai>=2.43.0",
    "redis>=5.0",
    "tenacity>=8.2",
    "loguru>=0.7.3",
    "sse-starlette>=3.4.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic" # Вместо рекомендованного строгого режима
