[project]
name = "cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "infraassist",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "redis>=8.0.0",
]

[tool.uv.sources]
infraassist = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[project.scripts]
cli = "cli.cli:main"
